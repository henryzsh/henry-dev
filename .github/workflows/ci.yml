name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipos (Astro)
        run: npm run typecheck
      - name: Build do site (Astro)
        run: npm run build
      - name: RSS e sitemap são XML válido
        run: |
          python3 -c "import sys, xml.dom.minidom as m; [m.parse(f) for f in sys.argv[1:]]" dist/rss.xml dist/sitemap.xml
      # Monta o Worker com os arquivos do site sem publicar nada (não precisa de conta da Cloudflare)
      - name: Deploy simulado
        run: npx wrangler deploy --dry-run
